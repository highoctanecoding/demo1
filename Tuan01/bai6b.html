<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Contact Us</title>
</head>
<body>
<h2>Contact Us</h2>
<form>
<fieldset>
<legend>Your message</legend>
<table>
<tr>
<td>To</td>
<td><input type="text" name="to" value="Example Cafe"></td>
</tr>
<tr>
<td>Your email</td>
<td><input type="email" name="youremail"></td>
</tr>
<tr>
<td>Message</td>
<td><textarea name="message" rows="5" cols="40"></textarea></td>
</tr>
<tr>
<td>Attach File</td>
<td><input type="file" name="file"></td>
</tr>
</table>
</fieldset>
<fieldset>
<legend>How you found us</legend>
<table>
<tr>
<td>How did you hear of us</td>
<td>
<select name="hear">
<option>Google</option>
</select>
</td>
</tr>
<tr>
<td>Newsletter</td>
<td><input type="checkbox" name="newsletter" checked> Ensure this box is checked if you would like to receive email updates</td>
</tr>
</table>
</fieldset>
<br>
<input type="submit" value="Send message">
</form>
</body>
</html>
